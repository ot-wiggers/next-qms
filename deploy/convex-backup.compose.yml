# Backup-Dienst für das self-hosted Convex auf Dokploy (Compose-Service "nextqms-convex").
# In Dokploy: diesen Service + das Volume "backups" in das bestehende Compose-File einfügen
# (neben "backend" und "dashboard"), unter Environment CONVEX_ADMIN_KEY setzen, Redeploy.
#
# Sicherheit: bewusst OHNE npm/Convex-CLI — nur ein per Digest festgepinntes Alpine-Image
# und BusyBox-wget gegen die HTTP-API des Backends (dieselben Endpunkte, die `convex export`
# nutzt). Keine Fremdpakete in der Umgebung, in der der Admin-Key liegt.
# "$$" ist Absicht: Compose ersetzt sonst "$(...)" / "${...}" schon beim Deploy
# (leere Werte → "sh: syntax error: unexpected "&&"" wie im alten Backup-Dienst).
services:
  backup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - CONVEX_URL=http://backend:3210
      - CONVEX_ADMIN_KEY=${CONVEX_ADMIN_KEY}
      - BACKUP_KEEP_DAYS=14
      - BACKUP_INTERVAL_SECONDS=86400
      - BACKUP_RETRY_SECONDS=600
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        auth="Authorization: Convex $${CONVEX_ADMIN_KEY}"
        latest() {
          wget -q -O - --header "$$auth" --header "Content-Type: application/json" \
            --post-data '{"path":"_system/cli/exports:getLatest","args":{},"format":"json"}' \
            "$${CONVEX_URL}/api/query"
        }
        start_ts() { sed -n 's/.*"start_ts":"\([0-9]*\)".*/\1/p'; }
        backup() {
          prev=$$(latest | start_ts) || return 1   # Zeitstempel des bisher neuesten Exports
          wget -q -O /dev/null --header "$$auth" --post-data '' \
            "$${CONVEX_URL}/api/export/request/zip?includeStorage=true" || return 1
          i=0
          while [ $$i -lt 360 ]; do            # max. 1 h auf den Export warten
            s=$$(latest) || return 1
            ts=$$(echo "$$s" | start_ts)
            if [ -z "$$ts" ] || [ "$$ts" = "$$prev" ]; then i=$$((i + 1)); sleep 10; continue; fi
            case "$$s" in
              *'"state":"completed"'*) break ;;
              *'"state":"failed"'*) echo "$$s" >&2; return 1 ;;
            esac
            i=$$((i + 1)); sleep 10
          done
          [ $$i -lt 360 ] || return 1
          f=/backups/convex-$$(date +%Y-%m-%d_%H%M%S).zip
          wget -q -O "$$f.part" --header "$$auth" "$${CONVEX_URL}/api/export/zip/$$ts" || return 1
          mv "$$f.part" "$$f"
          echo "$$(date -Iseconds) Backup ok: $$f ($$(du -h "$$f" | cut -f1))"
        }
        # Warten, bis das Backend antwortet (depends_on wartet nur auf den Containerstart)
        until wget -q -O /dev/null "$${CONVEX_URL}/version"; do sleep 10; done
        while true; do
          if backup; then
            wait_s=$${BACKUP_INTERVAL_SECONDS}
          else
            echo "$$(date -Iseconds) Backup FEHLGESCHLAGEN, neuer Versuch in $${BACKUP_RETRY_SECONDS}s" >&2
            rm -f /backups/*.part
            wait_s=$${BACKUP_RETRY_SECONDS}
          fi
          find /backups -name 'convex-*.zip' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep "$$wait_s"
        done

volumes:
  backups:
